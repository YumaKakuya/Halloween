<meta name="twitter:description" content="帽子もマントも、ぜんぶお菓子。パーツを組み合わせてハロウィンの仮装をつくり、画像にしてXでシェアできます。">
<meta name="twitter:image" content="__SITE_URL__/og-ja.png">
<meta name="twitter:image:alt" content="満月の下でお菓子の仮装をした3人のキャラクターと「おかし仮装工房」のタイトル">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
<div class="app">
  <header>
    <div class="topline">
      <div class="eyebrow">HALLOWEEN 2026 ・ 10.31</div>
      <a class="lang" href="/" hreflang="en" lang="en">English</a>
    </div>
    <h1>おかし仮装工房</h1>
    <p class="lead">帽子もマントも、ぜんぶお菓子でできています。パーツを選んで、食べられそうな仮装をつくろう。</p>
  </header>

  <div class="studio">
    <section class="stage" aria-label="仮装のプレビュー">
      <canvas id="stage" width="800" height="880" role="img" aria-label="お菓子の仮装をしたキャラクター"></canvas>
      <div class="actions">
        <button class="btn btn-primary" id="share" type="button">Xでシェア</button>
        <button class="btn btn-ghost" id="save" type="button">画像を保存</button>
        <button class="btn btn-quiet" id="random" type="button">おまかせで仮装</button>
      </div>
      <p class="hint">Xの投稿には、この仮装の画像がカードで表示されます。画像そのものがほしいときは「画像を保存」を使ってください。</p>
    </section>

    <section class="panel">
      <div class="result" aria-live="polite">
        <div class="result-label">今日の仮装</div>
        <p class="result-name" id="name"></p>
        <p class="result-items" id="items"></p>
        <div class="kcal">
          <div class="kcal-row">
            <span class="kcal-num"><span id="kcal">0</span><small id="unit">kcal</small></span>
            <span class="kcal-level" id="level"></span>
          </div>
          <div class="meter" aria-hidden="true"><span id="meter"></span></div>
        </div>
      </div>
      <div id="groups" class="panel"></div>
      <p class="note">カロリーは仮装をまるごと食べた場合の目安です（もちろん架空です）。</p>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script src="/costume.js"></script>
<script src="/app.js"></script>
</body>
</html>
